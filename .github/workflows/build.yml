name: Build

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Compile for Apple silicon and Intel, macOS 14+
        run: |
          ./compile.sh ExerciseMoose
          lipo ExerciseMoose -verify_arch arm64
          lipo ExerciseMoose -verify_arch x86_64

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck ./*.sh
